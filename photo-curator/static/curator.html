<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Curator - Immich</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'immich-primary': '#4250af',
                        'immich-bg': '#000000',
                        'immich-gray': {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Minimal custom styles for smooth transitions */
        .photo-card {
            transition: all 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .animate-slide-in {
            animation: slideIn 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-black dark:bg-immich-bg text-gray-900 dark:text-gray-100 min-h-screen">
    <!-- Main Container -->
    <div class="max-w-[1920px] mx-auto">
        <!-- Header -->
        <header class="bg-white dark:bg-immich-gray-900 border-b border-gray-200 dark:border-immich-gray-800">
            <div class="px-4 sm:px-6 lg:px-8 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <svg class="w-8 h-8 text-immich-primary" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                        </svg>
                        <div>
                            <h1 class="text-xl sm:text-2xl font-semibold text-gray-900 dark:text-white">Photo Curator</h1>
                            <p class="text-sm text-gray-500 dark:text-immich-gray-400 hidden sm:block">AI-powered monthly photo selection</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <!-- Duplicates Link -->
                        <a href="/duplicates" class="text-sm text-immich-primary hover:underline flex items-center gap-1">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5.97 4.06L14.09 6l1.41 1.41L16.91 6l1.06 1.06-1.41 1.41 1.41 1.42-1.06 1.06-1.41-1.41-1.42 1.41-1.06-1.06 1.41-1.42-1.41-1.41zM11.5 9.5L10 8l-1.5 1.5L7 8l-1.06 1.06L7.44 10.5l-1.5 1.44L7 13l1.5-1.5L10 13l1.06-1.06-1.5-1.44 1.5-1.44z"/>
                            </svg>
                            <span class="hidden sm:inline">Duplicates</span>
                        </a>
                        <!-- Preferences Link -->
                        <a href="/preferences" class="text-sm text-immich-primary hover:underline flex items-center gap-1">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                            </svg>
                            <span class="hidden sm:inline">Preferences</span>
                        </a>
                        <!-- Analytics Link -->
                        <a href="/analytics" class="text-sm text-immich-primary hover:underline flex items-center gap-1">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
                            </svg>
                            <span class="hidden sm:inline">Analytics</span>
                        </a>
                        <!-- Theme Toggle -->
                        <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-immich-gray-800 transition-colors">
                            <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                            </svg>
                            <svg id="theme-toggle-light-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path>
                            </svg>
                        </button>
                        <!-- User Info -->
                        <div class="text-right hidden sm:block">
                            <p class="text-xs text-gray-500 dark:text-immich-gray-400">Logged in as</p>
                            <p class="text-sm font-medium text-gray-900 dark:text-white" id="userName">Loading...</p>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Controls -->
        <div class="px-4 sm:px-6 lg:px-8 py-6">
            <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm dark:shadow-none border border-gray-200 dark:border-immich-gray-800 p-4 sm:p-6">
                <div class="flex flex-wrap gap-4 items-end">
                    <div class="flex-1 min-w-[120px]">
                        <label class="block text-sm font-medium text-gray-700 dark:text-immich-gray-300 mb-2">Year</label>
                        <input type="number" id="yearInput" value="2024" min="2020" max="2030"
                            class="w-full px-4 py-2 bg-white dark:bg-immich-gray-800 border border-gray-300 dark:border-immich-gray-700 rounded-lg text-gray-900 dark:text-white focus:ring-2 focus:ring-immich-primary focus:border-transparent outline-none transition-all" />
                    </div>
                    <div class="flex-1 min-w-[160px]">
                        <label class="block text-sm font-medium text-gray-700 dark:text-immich-gray-300 mb-2">Month</label>
                        <select id="monthSelect"
                            class="w-full px-4 py-2 bg-white dark:bg-immich-gray-800 border border-gray-300 dark:border-immich-gray-700 rounded-lg text-gray-900 dark:text-white focus:ring-2 focus:ring-immich-primary focus:border-transparent outline-none transition-all">
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>
                    <button onclick="loadPhotos()"
                        class="px-6 py-2 bg-immich-primary hover:bg-blue-700 text-white font-medium rounded-lg transition-colors shadow-sm hover:shadow-md">
                        Load Photos
                    </button>
                    <button onclick="analyzeMonth()"
                        class="px-6 py-2 bg-gray-600 hover:bg-gray-700 dark:bg-immich-gray-700 dark:hover:bg-immich-gray-600 text-white font-medium rounded-lg transition-colors shadow-sm hover:shadow-md">
                        Analyze with AI
                    </button>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="px-4 sm:px-6 lg:px-8 pb-32">
            <!-- Notification Toast -->
            <div id="notification" class="hidden fixed top-20 right-4 z-50 max-w-md animate-slide-in">
                <div id="notificationContent" class="rounded-lg shadow-lg p-4 border"></div>
            </div>

            <div id="content" class="fade-in">
                <div class="text-center py-16 text-gray-500 dark:text-immich-gray-400">
                    <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                    </svg>
                    <p class="text-lg">Select a month to start curating your photos</p>
                </div>
            </div>
        </div>

        <!-- Sticky Footer -->
        <div id="footer" class="hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-immich-gray-900 border-t border-gray-200 dark:border-immich-gray-800 shadow-2xl z-50">
            <div class="max-w-[1920px] mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <div class="flex items-center justify-between flex-wrap gap-4">
                    <div class="text-sm text-gray-600 dark:text-immich-gray-300">
                        <span class="font-medium text-immich-primary dark:text-blue-400 text-lg" id="selectionCount">0</span>
                        <span class="ml-2">photos selected</span>
                        <span id="aiSuggestedCount" class="ml-2 text-gray-500 dark:text-immich-gray-400"></span>
                    </div>
                    <button onclick="createAlbum()" id="createAlbumBtn"
                        class="px-6 py-2.5 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg transition-colors shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
                        Create Album in Immich
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentYear = 2024;
        let currentMonth = new Date().getMonth() + 1;
        let allPhotos = [];
        let aiSuggested = [];
        let selectedPhotos = new Set();
        let currentView = 'ai';

        // Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');

            if (isDark) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                document.getElementById('theme-toggle-dark-icon').classList.remove('hidden');
                document.getElementById('theme-toggle-light-icon').classList.add('hidden');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('theme-toggle-dark-icon').classList.add('hidden');
                document.getElementById('theme-toggle-light-icon').classList.remove('hidden');
            }
        }

        // Initialize theme
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
            document.getElementById('theme-toggle-dark-icon').classList.remove('hidden');
            document.getElementById('theme-toggle-light-icon').classList.add('hidden');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            const now = new Date();
            document.getElementById('yearInput').value = now.getFullYear();
            document.getElementById('monthSelect').value = now.getMonth() + 1;

            // Check authentication
            await checkAuth();
        });

        async function checkAuth() {
            try {
                const response = await fetchWithTimeout('/api/auth/check', {}, 10000);

                if (!response.ok) {
                    throw new Error(`Authentication failed (HTTP ${response.status})`);
                }

                const data = await response.json();

                if (!data.authenticated) {
                    window.location.href = data.login_url;
                    return;
                }

                currentUser = data.user;
                document.getElementById('userName').textContent = data.user.name || data.user.email;

            } catch (error) {
                console.error('Auth check failed:', error);
                showNotification('error', `Authentication failed: ${error.message}. Please login to Immich first.`);
            }
        }

        // Fetch with timeout helper
        async function fetchWithTimeout(url, options = {}, timeout = 30000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);

            try {
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                return response;
            } catch (error) {
                clearTimeout(timeoutId);
                if (error.name === 'AbortError') {
                    throw new Error('Request timed out');
                }
                throw error;
            }
        }

        // Notification system
        function showNotification(type, message, duration = 5000) {
            const notification = document.getElementById('notification');
            const content = document.getElementById('notificationContent');

            const colors = {
                success: 'bg-green-50 dark:bg-green-900/20 border-green-500 dark:border-green-700 text-green-800 dark:text-green-200',
                error: 'bg-red-50 dark:bg-red-900/20 border-red-500 dark:border-red-700 text-red-800 dark:text-red-200',
                warning: 'bg-yellow-50 dark:bg-yellow-900/20 border-yellow-500 dark:border-yellow-700 text-yellow-800 dark:text-yellow-200',
                info: 'bg-blue-50 dark:bg-blue-900/20 border-blue-500 dark:border-blue-700 text-blue-800 dark:text-blue-200'
            };

            const icons = {
                success: '✓',
                error: '✕',
                warning: '⚠',
                info: 'ℹ'
            };

            content.className = `rounded-lg shadow-lg p-4 border ${colors[type]}`;
            content.innerHTML = `
                <div class="flex items-start">
                    <span class="text-xl mr-3">${icons[type]}</span>
                    <div class="flex-1">${message}</div>
                    <button onclick="document.getElementById('notification').classList.add('hidden')" class="ml-4 text-lg font-bold opacity-50 hover:opacity-100">×</button>
                </div>
            `;

            notification.classList.remove('hidden');

            if (duration > 0) {
                setTimeout(() => {
                    notification.classList.add('hidden');
                }, duration);
            }
        }

        async function loadPhotos() {
            currentYear = parseInt(document.getElementById('yearInput').value);
            currentMonth = parseInt(document.getElementById('monthSelect').value);

            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="text-center py-16">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-gray-200 border-t-immich-primary"></div>
                    <p class="mt-4 text-gray-500 dark:text-immich-gray-400">Loading photos...</p>
                </div>
            `;

            try {
                const response = await fetchWithTimeout(`/api/photos/${currentYear}/${currentMonth}`);

                if (!response.ok) {
                    const errorText = await response.text().catch(() => 'Unknown error');
                    throw new Error(`Failed to load photos (HTTP ${response.status}): ${errorText}`);
                }

                const data = await response.json();

                allPhotos = data.photos || [];
                const session = data.session;

                if (session) {
                    aiSuggested = session.ai_suggested || [];
                    selectedPhotos = new Set(session.user_selected || aiSuggested);
                } else {
                    aiSuggested = [];
                    selectedPhotos = new Set();
                }

                renderUI();
            } catch (error) {
                console.error('Error loading photos:', error);
                const errorMsg = error.message || 'Unknown error occurred';
                content.innerHTML = `
                    <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-4 text-red-800 dark:text-red-200">
                        <p class="font-medium">Error loading photos</p>
                        <p class="text-sm mt-1">${errorMsg}</p>
                        <button onclick="loadPhotos()" class="mt-3 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm">
                            Try Again
                        </button>
                    </div>
                `;
                showNotification('error', `Failed to load photos: ${errorMsg}`);
            }
        }

        async function analyzeMonth() {
            currentYear = parseInt(document.getElementById('yearInput').value);
            currentMonth = parseInt(document.getElementById('monthSelect').value);

            if (!confirm(`Analyze all photos for ${getMonthName(currentMonth)} ${currentYear}? This may take a few minutes.`)) {
                return;
            }

            try {
                const response = await fetchWithTimeout(`/api/analyze/${currentYear}/${currentMonth}`, {
                    method: 'POST'
                }, 60000); // 60 second timeout for analysis

                if (!response.ok) {
                    const errorText = await response.text().catch(() => 'Unknown error');
                    throw new Error(`Analysis failed (HTTP ${response.status}): ${errorText}`);
                }

                const data = await response.json();
                showNotification('success', `Analysis started! Processing ${data.photo_count || 'photos'}. Refresh in a few minutes to see results.`, 8000);
            } catch (error) {
                console.error('Error starting analysis:', error);
                showNotification('error', `Error starting analysis: ${error.message}`, 10000);
            }
        }

        function renderUI() {
            const content = document.getElementById('content');

            if (allPhotos.length === 0) {
                content.innerHTML = `
                    <div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-lg p-6 text-blue-800 dark:text-blue-200">
                        <p class="font-medium text-lg">No photos found for ${getMonthName(currentMonth)} ${currentYear}</p>
                        <p class="mt-2">Try analyzing the month first or select a different month.</p>
                    </div>
                `;
                return;
            }

            const aiCount = aiSuggested.length;
            const selectedCount = selectedPhotos.size;

            content.innerHTML = `
                <!-- Stats -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div class="bg-white dark:bg-immich-gray-900 rounded-lg shadow-sm dark:shadow-none border border-gray-200 dark:border-immich-gray-800 p-6">
                        <p class="text-xs font-medium text-gray-500 dark:text-immich-gray-400 uppercase tracking-wide">Total Photos</p>
                        <p class="text-3xl font-bold text-gray-900 dark:text-white mt-2">${allPhotos.length}</p>
                    </div>
                    <div class="bg-white dark:bg-immich-gray-900 rounded-lg shadow-sm dark:shadow-none border border-gray-200 dark:border-immich-gray-800 p-6">
                        <p class="text-xs font-medium text-gray-500 dark:text-immich-gray-400 uppercase tracking-wide">AI Suggested</p>
                        <p class="text-3xl font-bold text-immich-primary mt-2">${aiCount}</p>
                    </div>
                    <div class="bg-white dark:bg-immich-gray-900 rounded-lg shadow-sm dark:shadow-none border border-gray-200 dark:border-immich-gray-800 p-6">
                        <p class="text-xs font-medium text-gray-500 dark:text-immich-gray-400 uppercase tracking-wide">Selected</p>
                        <p class="text-3xl font-bold text-green-600 mt-2">${selectedCount}</p>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="flex space-x-2 mb-6 border-b border-gray-200 dark:border-immich-gray-800">
                    <button class="tab px-6 py-3 font-medium text-sm transition-colors border-b-2 -mb-px ${currentView === 'ai' ? 'border-immich-primary text-immich-primary' : 'border-transparent text-gray-500 dark:text-immich-gray-400 hover:text-gray-700 dark:hover:text-immich-gray-300'}"
                        onclick="switchView('ai')">
                        AI Suggested (${aiCount})
                    </button>
                    <button class="tab px-6 py-3 font-medium text-sm transition-colors border-b-2 -mb-px ${currentView === 'all' ? 'border-immich-primary text-immich-primary' : 'border-transparent text-gray-500 dark:text-immich-gray-400 hover:text-gray-700 dark:hover:text-immich-gray-300'}"
                        onclick="switchView('all')">
                        All Photos (${allPhotos.length})
                    </button>
                </div>

                <!-- Photo Grid -->
                <div id="photoGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 gap-2"></div>
            `;

            renderPhotos();
            document.getElementById('footer').classList.remove('hidden');
            updateSelectionCount();
            resetFocus();
        }

        function switchView(view) {
            currentView = view;
            renderUI();
        }

        function renderPhotos() {
            const grid = document.getElementById('photoGrid');
            if (!grid) return;

            const photosToShow = currentView === 'ai'
                ? allPhotos.filter(p => aiSuggested.includes(p.asset_id))
                : allPhotos;

            grid.innerHTML = photosToShow.map(photo => {
                const isSelected = selectedPhotos.has(photo.asset_id);
                const isAISuggested = aiSuggested.includes(photo.asset_id);
                const thumbnailUrl = photo.thumbnail_url || 'https://via.placeholder.com/300?text=No+Image';

                return `
                    <div class="photo-card relative aspect-square rounded-lg overflow-hidden cursor-pointer bg-gray-100 dark:bg-immich-gray-800 group ${isSelected ? 'ring-4 ring-immich-primary ring-offset-2 dark:ring-offset-immich-bg' : ''} ${isAISuggested ? 'ring-2 ring-green-500' : ''}"
                         onclick="togglePhoto('${photo.asset_id}')">
                        <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-200"
                             src="${thumbnailUrl}"
                             alt="Photo"
                             loading="lazy"
                             onerror="this.src='https://via.placeholder.com/300?text=Error'">

                        <!-- Overlay on hover -->
                        <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition-all duration-200 flex items-center justify-center">
                            ${isSelected ? '<svg class="w-12 h-12 text-white drop-shadow-lg" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>' : ''}
                        </div>

                        <!-- Badges -->
                        ${isAISuggested ? '<div class="absolute top-2 right-2 bg-green-500 text-white text-xs font-bold px-2 py-1 rounded-full shadow-lg">AI</div>' : ''}
                        <div class="absolute bottom-2 left-2 bg-black bg-opacity-70 text-white text-xs px-2 py-1 rounded-md">
                            ⭐ ${(photo.score * 100).toFixed(0)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function togglePhoto(assetId) {
            if (selectedPhotos.has(assetId)) {
                selectedPhotos.delete(assetId);
            } else {
                selectedPhotos.add(assetId);
            }

            renderPhotos();
            updateSelectionCount();
            saveSelection();
        }

        function updateSelectionCount() {
            document.getElementById('selectionCount').textContent = selectedPhotos.size;

            const aiCount = Array.from(selectedPhotos).filter(id => aiSuggested.includes(id)).length;
            const userAddedCount = selectedPhotos.size - aiCount;

            let text = '';
            if (userAddedCount > 0) {
                text = ` (${aiCount} AI + ${userAddedCount} added by you)`;
            }
            document.getElementById('aiSuggestedCount').textContent = text;
        }

        async function saveSelection() {
            const selected = Array.from(selectedPhotos);
            const added = selected.filter(id => !aiSuggested.includes(id));
            const removed = aiSuggested.filter(id => !selectedPhotos.has(id));

            try {
                const response = await fetchWithTimeout(`/api/curation/${currentYear}/${currentMonth}/update`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ selected, added, removed })
                }, 15000);

                if (!response.ok) {
                    const errorText = await response.text().catch(() => 'Unknown error');
                    throw new Error(`Failed to save (HTTP ${response.status}): ${errorText}`);
                }

                // Silent success - only show errors
            } catch (error) {
                console.error('Error saving selection:', error);
                showNotification('warning', `Failed to auto-save your selection: ${error.message}. Your changes may not be saved.`, 8000);
            }
        }

        async function createAlbum() {
            if (selectedPhotos.size === 0) {
                showNotification('warning', 'Please select at least one photo');
                return;
            }

            const albumName = prompt(
                'Album name:',
                `Best of ${getMonthName(currentMonth)} ${currentYear}`
            );

            if (!albumName) return;

            const btn = document.getElementById('createAlbumBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';

            try {
                const response = await fetchWithTimeout(`/api/curation/${currentYear}/${currentMonth}/complete`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        asset_ids: Array.from(selectedPhotos),
                        album_name: albumName,
                        description: `Curated collection of ${selectedPhotos.size} photos`
                    })
                }, 30000);

                if (!response.ok) {
                    const errorText = await response.text().catch(() => 'Unknown error');
                    throw new Error(`Failed to create album (HTTP ${response.status}): ${errorText}`);
                }

                const data = await response.json();
                showNotification('success', `✓ Album "${albumName}" created with ${selectedPhotos.size} photos!`, 10000);
                btn.textContent = '✓ Album Created';
            } catch (error) {
                console.error('Error creating album:', error);
                showNotification('error', `Error creating album: ${error.message}`, 10000);
                btn.disabled = false;
                btn.textContent = 'Create Album in Immich';
            }
        }

        function getMonthName(month) {
            const months = ['January', 'February', 'March', 'April', 'May', 'June',
                          'July', 'August', 'September', 'October', 'November', 'December'];
            return months[month - 1];
        }

        // Keyboard shortcuts
        let focusedPhotoIndex = -1;

        document.addEventListener('keydown', function(e) {
            // Don't trigger shortcuts if typing in input fields
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
                return;
            }

            const photosToShow = currentView === 'ai'
                ? allPhotos.filter(p => aiSuggested.includes(p.asset_id))
                : allPhotos;

            if (photosToShow.length === 0) return;

            // Space: Toggle current photo
            if (e.code === 'Space') {
                e.preventDefault();
                if (focusedPhotoIndex >= 0 && focusedPhotoIndex < photosToShow.length) {
                    togglePhoto(photosToShow[focusedPhotoIndex].asset_id);
                    updateFocusVisual();
                }
            }

            // Arrow Right: Next photo
            else if (e.code === 'ArrowRight') {
                e.preventDefault();
                focusedPhotoIndex = Math.min(focusedPhotoIndex + 1, photosToShow.length - 1);
                updateFocusVisual();
            }

            // Arrow Left: Previous photo
            else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                focusedPhotoIndex = Math.max(focusedPhotoIndex - 1, 0);
                updateFocusVisual();
            }

            // Arrow Down: Move down one row (assuming 8 cols on large screen, adjust based on viewport)
            else if (e.code === 'ArrowDown') {
                e.preventDefault();
                const cols = getGridColumns();
                focusedPhotoIndex = Math.min(focusedPhotoIndex + cols, photosToShow.length - 1);
                updateFocusVisual();
            }

            // Arrow Up: Move up one row
            else if (e.code === 'ArrowUp') {
                e.preventDefault();
                const cols = getGridColumns();
                focusedPhotoIndex = Math.max(focusedPhotoIndex - cols, 0);
                updateFocusVisual();
            }

            // Escape: Clear selection
            else if (e.code === 'Escape') {
                e.preventDefault();
                selectedPhotos.clear();
                renderPhotos();
                updateSelectionCount();
                saveSelection();
            }

            // Ctrl/Cmd + A: Select all visible photos
            else if ((e.ctrlKey || e.metaKey) && e.code === 'KeyA') {
                e.preventDefault();
                photosToShow.forEach(photo => selectedPhotos.add(photo.asset_id));
                renderPhotos();
                updateSelectionCount();
                saveSelection();
            }

            // Enter: Create album (if photos selected)
            else if (e.code === 'Enter' && selectedPhotos.size > 0) {
                e.preventDefault();
                createAlbum();
            }
        });

        function getGridColumns() {
            // Detect number of columns based on viewport width
            const width = window.innerWidth;
            if (width >= 1536) return 8;  // 2xl
            if (width >= 1280) return 6;  // xl
            if (width >= 1024) return 5;  // lg
            if (width >= 768) return 4;   // md
            if (width >= 640) return 3;   // sm
            return 2;  // mobile
        }

        function updateFocusVisual() {
            // Remove previous focus
            document.querySelectorAll('.photo-card').forEach(card => {
                card.classList.remove('ring-2', 'ring-yellow-400');
            });

            // Add focus to current photo
            const cards = document.querySelectorAll('.photo-card');
            if (focusedPhotoIndex >= 0 && focusedPhotoIndex < cards.length) {
                const card = cards[focusedPhotoIndex];
                card.classList.add('ring-2', 'ring-yellow-400');

                // Scroll into view if needed
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // Reset focus when switching views or loading new photos
        function resetFocus() {
            focusedPhotoIndex = 0;
            updateFocusVisual();
        }
    </script>
</body>
</html>
