<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immich Server Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'immich-primary': '#4250af',
                        'immich-bg': '#000000',
                        'immich-gray': {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-immich-bg text-gray-900 dark:text-gray-100 min-h-screen p-5">
    <div class="max-w-[1400px] mx-auto">
        <header class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm p-5 mb-5 border border-gray-200 dark:border-immich-gray-800">
            <h1 class="text-2xl font-bold text-immich-primary mb-1">📊 Immich Server Manager</h1>
            <p class="text-sm text-gray-500 dark:text-immich-gray-400">Monitoring, Backups, and Health Checks</p>
        </header>

        <div id="content">
            <div class="text-center py-10 text-gray-500 dark:text-immich-gray-400">
                <svg class="animate-spin inline-block w-8 h-8 text-immich-primary mb-3" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p>Loading dashboard...</p>
            </div>
        </div>
    </div>

    <script>
        let refreshInterval;

        // Escape HTML to prevent XSS
        function esc(str) {
            const div = document.createElement('div');
            div.textContent = String(str ?? '');
            return div.innerHTML;
        }

        async function fetchData() {
            try {
                const [status, disks, backups, alerts] = await Promise.all([
                    fetch('/api/status').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
                    fetch('/api/disks').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
                    fetch('/api/backups').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
                    fetch('/api/alerts').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                ]);

                renderDashboard(status, disks, backups, alerts);
            } catch (error) {
                const el = document.getElementById('content');
                el.textContent = '';
                const alertDiv = document.createElement('div');
                alertDiv.className = 'px-4 py-3 rounded-lg text-sm bg-red-50 dark:bg-red-900/20 text-red-800 dark:text-red-200 border border-red-200 dark:border-red-800';
                alertDiv.textContent = 'Failed to load data. Please check your connection and authentication.';
                el.appendChild(alertDiv);
            }
        }

        function renderDashboard(status, disks, backups, alerts) {
            const system = status.system;
            const immichHealthy = status.immich_healthy;

            document.getElementById('content').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5 mb-5">
                    <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-immich-gray-800 p-5">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white border-b border-gray-200 dark:border-immich-gray-700 pb-2.5 mb-4">🖥️ System Status</h2>
                        <div class="flex justify-between items-center py-2.5 border-b border-gray-50 dark:border-immich-gray-800">
                            <span class="text-sm text-gray-500 dark:text-immich-gray-400">CPU Usage</span>
                            <span class="font-semibold ${Number(system.cpu_percent) > 80 ? 'text-yellow-500' : 'text-green-500'}">
                                ${Number(system.cpu_percent).toFixed(1)}%
                            </span>
                        </div>
                        <div class="flex justify-between items-center py-2.5 border-b border-gray-50 dark:border-immich-gray-800">
                            <span class="text-sm text-gray-500 dark:text-immich-gray-400">Memory Usage</span>
                            <span class="font-semibold ${Number(system.memory_percent) > 80 ? 'text-yellow-500' : 'text-green-500'}">
                                ${Number(system.memory_percent).toFixed(1)}% (${Number(system.memory_used_gb).toFixed(1)} GB)
                            </span>
                        </div>
                        <div class="flex justify-between items-center py-2.5">
                            <span class="text-sm text-gray-500 dark:text-immich-gray-400">Disk Usage</span>
                            <span class="font-semibold ${Number(system.disk_usage_percent) > 85 ? 'text-yellow-500' : 'text-green-500'}">
                                ${Number(system.disk_usage_percent).toFixed(1)}% (${Number(system.disk_used_gb).toFixed(1)} GB)
                            </span>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-immich-gray-800 p-5">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white border-b border-gray-200 dark:border-immich-gray-700 pb-2.5 mb-4">📷 Immich Status</h2>
                        <div class="flex justify-between items-center py-2.5 border-b border-gray-50 dark:border-immich-gray-800">
                            <span class="text-sm text-gray-500 dark:text-immich-gray-400">Service Health</span>
                            <span class="font-semibold ${immichHealthy ? 'text-green-500' : 'text-red-500'}">
                                ${immichHealthy ? '✓ Healthy' : '✗ Issues Detected'}
                            </span>
                        </div>
                        <div class="flex justify-between items-center py-2.5">
                            <span class="text-sm text-gray-500 dark:text-immich-gray-400">Containers</span>
                            <span class="font-semibold text-gray-900 dark:text-white">${Number(status.containers.length)} running</span>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-immich-gray-800 p-5">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white border-b border-gray-200 dark:border-immich-gray-700 pb-2.5 mb-4">💾 Disk Health</h2>
                        ${(disks.disks || []).map(disk => `
                            <div class="flex justify-between items-center py-2.5 border-b border-gray-50 dark:border-immich-gray-800 last:border-0">
                                <span class="text-sm text-gray-500 dark:text-immich-gray-400">${esc(disk.device)}</span>
                                <span class="font-semibold ${disk.smart_status ? 'text-green-500' : 'text-red-500'}">
                                    ${disk.temperature ? Number(disk.temperature) + '°C' : 'N/A'}
                                </span>
                            </div>
                        `).join('') || '<p class="text-sm text-gray-500 dark:text-immich-gray-400">No disk data available</p>'}
                    </div>

                    <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-immich-gray-800 p-5">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white border-b border-gray-200 dark:border-immich-gray-700 pb-2.5 mb-4">💿 Backups</h2>
                        ${(backups.history || []).slice(0, 3).map(backup => `
                            <div class="flex justify-between items-center py-2.5 border-b border-gray-50 dark:border-immich-gray-800 last:border-0">
                                <span class="text-sm text-gray-500 dark:text-immich-gray-400">${esc(new Date(backup.timestamp).toLocaleDateString())}</span>
                                <span class="font-semibold ${backup.status === 'success' ? 'text-green-500' : 'text-red-500'}">
                                    ${esc(backup.status)}
                                </span>
                            </div>
                        `).join('') || '<p class="text-sm text-gray-500 dark:text-immich-gray-400 mb-3">No backups yet</p>'}
                        <button class="mt-3 px-5 py-2 bg-immich-primary hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors cursor-pointer border-none" onclick="triggerBackup()">Backup Now</button>
                    </div>
                </div>

                ${(alerts.alerts || []).length > 0 ? `
                    <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-immich-gray-800 p-5">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white border-b border-gray-200 dark:border-immich-gray-700 pb-2.5 mb-4">🔔 Recent Alerts</h2>
                        ${alerts.alerts.slice(0, 5).map(alert => `
                            <div class="px-3 py-3 rounded-lg mb-2.5 text-sm ${alert.severity === 'critical' ? 'bg-red-50 dark:bg-red-900/20 text-red-800 dark:text-red-200' : alert.severity === 'warning' ? 'bg-yellow-50 dark:bg-yellow-900/20 text-yellow-800 dark:text-yellow-200' : 'bg-blue-50 dark:bg-blue-900/20 text-blue-800 dark:text-blue-200'}">
                                <strong>${esc(alert.category)}:</strong> ${esc(alert.message)}
                                <small class="block mt-1 opacity-70">
                                    ${esc(new Date(alert.timestamp).toLocaleString())}
                                </small>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}

                <!-- Log Viewer Panel -->
                <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-immich-gray-800 p-5 mt-5">
                    <h2 class="text-lg font-semibold text-gray-900 dark:text-white border-b border-gray-200 dark:border-immich-gray-700 pb-2.5 mb-4">📋 Log Viewer</h2>
                    <div class="flex flex-wrap gap-3 mb-3 items-center">
                        <select id="logServiceSelect" class="px-3 py-2 rounded-lg text-sm bg-gray-100 dark:bg-immich-gray-800 border border-gray-200 dark:border-immich-gray-700 text-gray-900 dark:text-white cursor-pointer" onchange="onLogServiceChange()">
                            <option value="immich-server">immich-server</option>
                            <option value="immich-ml">immich-ml</option>
                            <option value="immich-postgres">immich-postgres</option>
                            <option value="immich-redis">immich-redis</option>
                            <option value="server_manager">server_manager</option>
                            <option value="photo_curator">photo_curator</option>
                            <option value="system">system</option>
                        </select>
                        <button class="px-4 py-2 bg-immich-primary hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors cursor-pointer border-none" onclick="loadLogSnapshot()">Refresh</button>
                        <label class="flex items-center gap-2 cursor-pointer text-sm text-gray-700 dark:text-gray-300 select-none">
                            <input type="checkbox" id="logLiveToggle" class="cursor-pointer" onchange="toggleLogStream()">
                            Live
                        </label>
                    </div>
                    <pre id="logOutput" class="bg-gray-950 text-gray-200 rounded-lg p-3 text-xs font-mono h-72 overflow-y-auto whitespace-pre-wrap break-all">Select a service and click Refresh to load logs.</pre>
                </div>

                <!-- Service Controls Panel -->
                <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-immich-gray-800 p-5 mt-5">
                    <h2 class="text-lg font-semibold text-gray-900 dark:text-white border-b border-gray-200 dark:border-immich-gray-700 pb-2.5 mb-4">⚙️ Service Controls</h2>
                    <div class="space-y-2">
                        ${["immich-server","immich-ml","immich-postgres","immich-redis","server_manager","photo_curator"].map(svc => `
                            <div class="flex justify-between items-center py-2 border-b border-gray-50 dark:border-immich-gray-800 last:border-0">
                                <span class="text-sm font-mono text-gray-700 dark:text-gray-300">${esc(svc)}</span>
                                <button id="restartBtn_${esc(svc)}" class="px-3 py-1.5 bg-immich-primary hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition-colors cursor-pointer border-none" onclick="restartService('${esc(svc)}')">Restart</button>
                            </div>
                        `).join('')}
                        <div class="pt-3 text-right">
                            <button class="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-sm font-medium transition-colors cursor-pointer border-none" onclick="restartAllServices()">Restart All Immich Services</button>
                        </div>
                    </div>
                </div>

                <!-- Update Management Panel -->
                <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-immich-gray-800 p-5 mt-5" id="updatePanel">
                    <h2 class="text-lg font-semibold text-gray-900 dark:text-white border-b border-gray-200 dark:border-immich-gray-700 pb-2.5 mb-4">🔄 Update Management</h2>
                    <div id="updateStatus" class="text-sm text-gray-500 dark:text-gray-400">Loading version info...</div>
                </div>
            `;
        }

        async function triggerBackup() {
            if (!confirm('Start a backup now?')) return;

            try {
                const response = await fetch('/api/backup/now', { method: 'POST' });
                const data = await response.json();
                window.alert('Backup started! Check the backups section for progress.');
            } catch (error) {
                window.alert('Failed to start backup.');
            }
        }

        // Initial load
        fetchData();

        // Auto-refresh every 30 seconds
        refreshInterval = setInterval(fetchData, 30000);

        // --- Log Viewer ---
        let _logEventSource = null;

        function onLogServiceChange() {
            const live = document.getElementById('logLiveToggle');
            if (live && live.checked) {
                live.checked = false;
                stopLogStream();
            }
            loadLogSnapshot();
        }

        async function loadLogSnapshot() {
            const svc = document.getElementById('logServiceSelect');
            if (!svc) return;
            const service = svc.value;
            const out = document.getElementById('logOutput');
            if (!out) return;
            out.textContent = 'Loading...';
            try {
                const r = await fetch(`/api/logs/${encodeURIComponent(service)}`);
                if (!r.ok) throw new Error(r.status);
                const data = await r.json();
                out.textContent = (data.lines || []).join('\n') || '(no output)';
                out.scrollTop = out.scrollHeight;
            } catch (e) {
                out.textContent = `Failed to load logs: ${e}`;
            }
        }

        function toggleLogStream() {
            const toggle = document.getElementById('logLiveToggle');
            if (!toggle) return;
            if (toggle.checked) startLogStream();
            else stopLogStream();
        }

        function startLogStream() {
            const svc = document.getElementById('logServiceSelect');
            if (!svc) return;
            const service = svc.value;
            const out = document.getElementById('logOutput');
            if (!out) return;
            stopLogStream();
            out.textContent = '';
            _logEventSource = new EventSource(`/api/logs/${encodeURIComponent(service)}/stream`);
            _logEventSource.onmessage = (e) => {
                out.textContent += e.data + '\n';
                out.scrollTop = out.scrollHeight;
            };
            _logEventSource.onerror = () => {
                const toggle = document.getElementById('logLiveToggle');
                if (toggle) toggle.checked = false;
                stopLogStream();
            };
        }

        function stopLogStream() {
            if (_logEventSource) { _logEventSource.close(); _logEventSource = null; }
        }

        // --- Service Controls ---
        async function restartService(service) {
            if (!confirm(`Restart ${service}?`)) return;
            const btn = document.getElementById(`restartBtn_${service}`);
            if (btn) { btn.textContent = '...'; btn.disabled = true; }
            try {
                const r = await fetch(`/api/services/${encodeURIComponent(service)}/restart`, { method: 'POST' });
                if (btn) btn.textContent = r.ok ? '✓' : '✗';
                setTimeout(() => { if (btn) { btn.textContent = 'Restart'; btn.disabled = false; } }, 3000);
            } catch (e) {
                if (btn) { btn.textContent = '✗'; btn.disabled = false; }
            }
        }

        async function restartAllServices() {
            if (!confirm('Restart ALL Immich services? This will briefly interrupt Immich.')) return;
            try {
                const r = await fetch('/api/services/restart-all', { method: 'POST' });
                const data = await r.json();
                window.alert(r.ok ? 'All services restarted.' : `Failed: ${data.detail || 'unknown error'}`);
            } catch (e) {
                window.alert('Failed to restart all services.');
            }
        }

        // --- Update Management ---
        let _updateEventSource = null;

        function _makeEl(tag, cls, text) {
            const el = document.createElement(tag);
            if (cls) el.className = cls;
            if (text != null) el.textContent = text;
            return el;
        }

        async function loadUpdateStatus() {
            const statusEl = document.getElementById('updateStatus');
            if (!statusEl) return;
            statusEl.textContent = 'Loading version info...';

            try {
                const r = await fetch('/api/updates/status');
                if (!r.ok) throw new Error(r.status);
                const data = await r.json();

                const current = data.current_version || 'unknown';
                const latest = data.latest_version || 'unknown';
                const upToDate = !data.update_available;

                statusEl.textContent = '';

                // Version row
                const row = _makeEl('div', 'flex flex-wrap gap-4 items-center mb-4');

                const curSpan = _makeEl('span', 'text-gray-700 dark:text-gray-300');
                curSpan.append('Current: ', _makeEl('span', 'font-mono font-semibold', `v${current}`));
                row.appendChild(curSpan);

                const latSpan = _makeEl('span', 'text-gray-700 dark:text-gray-300');
                latSpan.append('Latest: ', _makeEl('span', 'font-mono font-semibold', `v${latest}`));
                row.appendChild(latSpan);

                // Changelog link — only allow github.com URLs
                if (data.changelog_url && data.changelog_url.startsWith('https://github.com/')) {
                    const a = _makeEl('a', 'text-immich-primary hover:underline text-sm', 'View Changelog ↗');
                    a.href = data.changelog_url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    row.appendChild(a);
                }

                if (upToDate) {
                    row.appendChild(_makeEl('span',
                        'px-3 py-1 bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 rounded-full text-sm font-medium',
                        'Up to date ✓'));
                } else {
                    const btn = _makeEl('button',
                        'px-4 py-2 bg-immich-primary hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors cursor-pointer border-none',
                        'Apply Update');
                    btn.addEventListener('click', applyUpdate);
                    row.appendChild(btn);
                }
                statusEl.appendChild(row);

                // Progress area (hidden until update triggered)
                const prog = _makeEl('div',
                    'hidden mb-4 bg-gray-950 text-gray-200 rounded-lg p-3 text-xs font-mono max-h-40 overflow-y-auto');
                prog.id = 'updateProgress';
                statusEl.appendChild(prog);

                // History
                const history = data.history || [];
                if (history.length > 0) {
                    const section = _makeEl('div', 'border-t border-gray-100 dark:border-immich-gray-800 pt-3');
                    section.appendChild(_makeEl('h3',
                        'text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2', 'Update History'));
                    const table = _makeEl('table', 'text-sm w-full');
                    history.slice(0, 5).forEach(h => {
                        const ts = h.timestamp ? new Date(h.timestamp).toLocaleDateString() : '';
                        const ok = h.status === 'success';
                        const tr = _makeEl('tr');
                        const td1 = _makeEl('td', 'py-1 pr-4 text-gray-500 dark:text-gray-400', ts);
                        const td2 = _makeEl('td', 'py-1 pr-4 font-mono text-xs',
                            `v${h.from_version || ''} → v${h.to_version || ''}`);
                        const td3 = _makeEl('td',
                            `py-1 font-medium ${ok ? 'text-green-500' : 'text-red-500'}`,
                            ok ? '✓ success' : `✗ ${h.status}`);
                        tr.append(td1, td2, td3);
                        table.appendChild(tr);
                    });
                    section.appendChild(table);
                    statusEl.appendChild(section);
                }
            } catch (e) {
                if (statusEl) statusEl.textContent = `Failed to load update status: ${e}`;
            }
        }

        async function applyUpdate() {
            if (!confirm('Apply the latest Immich update? A snapshot will be taken first and rollback is automatic on failure.')) return;
            try {
                const r = await fetch('/api/updates/apply', { method: 'POST' });
                const data = await r.json();
                if (data.status === 'up_to_date') { window.alert('Already up to date.'); return; }
                if (!r.ok) { window.alert(`Failed to start update: ${data.detail || 'unknown error'}`); return; }
                const prog = document.getElementById('updateProgress');
                if (prog) { prog.textContent = ''; prog.classList.remove('hidden'); }
                startUpdateStream();
            } catch (e) {
                window.alert(`Failed to start update: ${e}`);
            }
        }

        function startUpdateStream() {
            if (_updateEventSource) { _updateEventSource.close(); }
            _updateEventSource = new EventSource('/api/updates/apply/stream');
            _updateEventSource.onmessage = (e) => {
                const prog = document.getElementById('updateProgress');
                if (!prog) return;
                try {
                    const obj = JSON.parse(e.data);
                    const line = _makeEl('div', null);
                    if (obj.step === 'done') line.className = 'text-green-400';
                    else if (obj.step === 'rolled_back' || obj.step === 'error') line.className = 'text-red-400';
                    line.textContent = `[${obj.step}] ${obj.message}`;
                    prog.appendChild(line);
                    prog.scrollTop = prog.scrollHeight;
                    if (['done', 'rolled_back', 'error'].includes(obj.step)) {
                        _updateEventSource.close();
                        _updateEventSource = null;
                        loadUpdateStatus();
                    }
                } catch (_) {}
            };
            _updateEventSource.onerror = () => {
                if (_updateEventSource) { _updateEventSource.close(); _updateEventSource = null; }
            };
        }

        // Load update status after initial render
        setTimeout(loadUpdateStatus, 500);
    </script>
</body>
</html>
