<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immich Server Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'immich-primary': '#4250af',
                        'immich-bg': '#000000',
                        'immich-gray': {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-immich-bg text-gray-900 dark:text-gray-100 min-h-screen p-5">
    <div class="max-w-[1400px] mx-auto">
        <header class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm p-5 mb-5 border border-gray-200 dark:border-immich-gray-800">
            <h1 class="text-2xl font-bold text-immich-primary mb-1">📊 Immich Server Manager</h1>
            <p class="text-sm text-gray-500 dark:text-immich-gray-400">Monitoring, Backups, and Health Checks</p>
        </header>

        <div id="content">
            <div class="text-center py-10 text-gray-500 dark:text-immich-gray-400">
                <svg class="animate-spin inline-block w-8 h-8 text-immich-primary mb-3" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p>Loading dashboard...</p>
            </div>
        </div>
    </div>

    <script>
        let refreshInterval;

        // Escape HTML to prevent XSS
        function esc(str) {
            const div = document.createElement('div');
            div.textContent = String(str ?? '');
            return div.innerHTML;
        }

        async function fetchData() {
            try {
                const [status, disks, backups, alerts] = await Promise.all([
                    fetch('/api/status').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
                    fetch('/api/disks').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
                    fetch('/api/backups').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
                    fetch('/api/alerts').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                ]);

                renderDashboard(status, disks, backups, alerts);
            } catch (error) {
                const el = document.getElementById('content');
                el.textContent = '';
                const alertDiv = document.createElement('div');
                alertDiv.className = 'px-4 py-3 rounded-lg text-sm bg-red-50 dark:bg-red-900/20 text-red-800 dark:text-red-200 border border-red-200 dark:border-red-800';
                alertDiv.textContent = 'Failed to load data. Please check your connection and authentication.';
                el.appendChild(alertDiv);
            }
        }

        function renderDashboard(status, disks, backups, alerts) {
            const system = status.system;
            const immichHealthy = status.immich_healthy;

            document.getElementById('content').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5 mb-5">
                    <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-immich-gray-800 p-5">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white border-b border-gray-200 dark:border-immich-gray-700 pb-2.5 mb-4">🖥️ System Status</h2>
                        <div class="flex justify-between items-center py-2.5 border-b border-gray-50 dark:border-immich-gray-800">
                            <span class="text-sm text-gray-500 dark:text-immich-gray-400">CPU Usage</span>
                            <span class="font-semibold ${Number(system.cpu_percent) > 80 ? 'text-yellow-500' : 'text-green-500'}">
                                ${Number(system.cpu_percent).toFixed(1)}%
                            </span>
                        </div>
                        <div class="flex justify-between items-center py-2.5 border-b border-gray-50 dark:border-immich-gray-800">
                            <span class="text-sm text-gray-500 dark:text-immich-gray-400">Memory Usage</span>
                            <span class="font-semibold ${Number(system.memory_percent) > 80 ? 'text-yellow-500' : 'text-green-500'}">
                                ${Number(system.memory_percent).toFixed(1)}% (${Number(system.memory_used_gb).toFixed(1)} GB)
                            </span>
                        </div>
                        <div class="flex justify-between items-center py-2.5">
                            <span class="text-sm text-gray-500 dark:text-immich-gray-400">Disk Usage</span>
                            <span class="font-semibold ${Number(system.disk_usage_percent) > 85 ? 'text-yellow-500' : 'text-green-500'}">
                                ${Number(system.disk_usage_percent).toFixed(1)}% (${Number(system.disk_used_gb).toFixed(1)} GB)
                            </span>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-immich-gray-800 p-5">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white border-b border-gray-200 dark:border-immich-gray-700 pb-2.5 mb-4">📷 Immich Status</h2>
                        <div class="flex justify-between items-center py-2.5 border-b border-gray-50 dark:border-immich-gray-800">
                            <span class="text-sm text-gray-500 dark:text-immich-gray-400">Service Health</span>
                            <span class="font-semibold ${immichHealthy ? 'text-green-500' : 'text-red-500'}">
                                ${immichHealthy ? '✓ Healthy' : '✗ Issues Detected'}
                            </span>
                        </div>
                        <div class="flex justify-between items-center py-2.5">
                            <span class="text-sm text-gray-500 dark:text-immich-gray-400">Containers</span>
                            <span class="font-semibold text-gray-900 dark:text-white">${Number(status.containers.length)} running</span>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-immich-gray-800 p-5">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white border-b border-gray-200 dark:border-immich-gray-700 pb-2.5 mb-4">💾 Disk Health</h2>
                        ${(disks.disks || []).map(disk => `
                            <div class="flex justify-between items-center py-2.5 border-b border-gray-50 dark:border-immich-gray-800 last:border-0">
                                <span class="text-sm text-gray-500 dark:text-immich-gray-400">${esc(disk.device)}</span>
                                <span class="font-semibold ${disk.smart_status ? 'text-green-500' : 'text-red-500'}">
                                    ${disk.temperature ? Number(disk.temperature) + '°C' : 'N/A'}
                                </span>
                            </div>
                        `).join('') || '<p class="text-sm text-gray-500 dark:text-immich-gray-400">No disk data available</p>'}
                    </div>

                    <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-immich-gray-800 p-5">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white border-b border-gray-200 dark:border-immich-gray-700 pb-2.5 mb-4">💿 Backups</h2>
                        ${(backups.history || []).slice(0, 3).map(backup => `
                            <div class="flex justify-between items-center py-2.5 border-b border-gray-50 dark:border-immich-gray-800 last:border-0">
                                <span class="text-sm text-gray-500 dark:text-immich-gray-400">${esc(new Date(backup.timestamp).toLocaleDateString())}</span>
                                <span class="font-semibold ${backup.status === 'success' ? 'text-green-500' : 'text-red-500'}">
                                    ${esc(backup.status)}
                                </span>
                            </div>
                        `).join('') || '<p class="text-sm text-gray-500 dark:text-immich-gray-400 mb-3">No backups yet</p>'}
                        <button class="mt-3 px-5 py-2 bg-immich-primary hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors cursor-pointer border-none" onclick="triggerBackup()">Backup Now</button>
                    </div>
                </div>

                ${(alerts.alerts || []).length > 0 ? `
                    <div class="bg-white dark:bg-immich-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-immich-gray-800 p-5">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white border-b border-gray-200 dark:border-immich-gray-700 pb-2.5 mb-4">🔔 Recent Alerts</h2>
                        ${alerts.alerts.slice(0, 5).map(alert => `
                            <div class="px-3 py-3 rounded-lg mb-2.5 text-sm ${alert.severity === 'critical' ? 'bg-red-50 dark:bg-red-900/20 text-red-800 dark:text-red-200' : alert.severity === 'warning' ? 'bg-yellow-50 dark:bg-yellow-900/20 text-yellow-800 dark:text-yellow-200' : 'bg-blue-50 dark:bg-blue-900/20 text-blue-800 dark:text-blue-200'}">
                                <strong>${esc(alert.category)}:</strong> ${esc(alert.message)}
                                <small class="block mt-1 opacity-70">
                                    ${esc(new Date(alert.timestamp).toLocaleString())}
                                </small>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
            `;
        }

        async function triggerBackup() {
            if (!confirm('Start a backup now?')) return;

            try {
                const response = await fetch('/api/backup/now', { method: 'POST' });
                const data = await response.json();
                window.alert('Backup started! Check the backups section for progress.');
            } catch (error) {
                window.alert('Failed to start backup.');
            }
        }

        // Initial load
        fetchData();

        // Auto-refresh every 30 seconds
        refreshInterval = setInterval(fetchData, 30000);
    </script>
</body>
</html>
